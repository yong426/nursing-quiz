<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>간호조무사 모의 문제은행</title>
<meta name="description" content="간호조무사 국가시험 대비 자체 제작 모의문제 1,000문항 · 과목별 랜덤 출제 · 실전 모의고사 · 채점 · 해설 · 오답노트">
<style>
:root{
  --bg:#f4f6f6; --card:#ffffff; --ink:#1d2b2a; --sub:#5f7270; --line:#dfe7e6;
  /* 색은 역할로 고정한다 — 탭마다 다른 색을 쓰지 않고 모든 화면이 같은 규칙을 따른다.
     acc(청록)  = 실행·긍정: 주 버튼, 선택한 칩, 정답, 해설
     acc2(남색) = 구조·이동: 활성 탭, 세그먼트, 소제목, 표 머리, 현재 위치, 모의고사
     star(금색) = 별표 전용 */
  --acc:#0d8a72;  --acc-soft:#e4f2ee;  --acc-ink:#ffffff;
  --acc2:#134e8f; --acc2-soft:#e8eff8;
  --star:#e8a23d; --star-soft:#fff8ec; --star-ink:#5c3d0c;
  --ok:#14934a; --ok-bg:#e7f6ec; --warn:#c47a17; --bad:#d93a3a; --bad-bg:#fdecec;
  --chip:#ecf2f1; --chip-on:#0d8a72; --shadow:0 1px 3px rgba(20,45,40,.08);
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.55;
  /* --banner-h: 토스 배너는 페이지 위 오버레이라 래퍼 브릿지가 높이를 넣어준다 */
  padding-bottom:calc(env(safe-area-inset-bottom) + var(--banner-h, 0px))}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:1.25rem;margin:8px 0 2px}
.sub{color:var(--sub);font-size:.85rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:.95rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:.8rem;color:var(--acc2);margin:12px 0 6px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:7px 13px;font-size:.85rem;cursor:pointer;user-select:none;
  transition:background .12s,color .12s,border-color .12s}
.chip small{color:inherit;opacity:.65;font-size:.75em;margin-left:3px}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content}
.seg button{border:0;background:var(--card);padding:8px 16px;font-size:.9rem;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--acc2);color:#fff}
.seg button.on.star{background:var(--star);color:var(--star-ink)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
@media (max-width:520px){ .tabs{grid-template-columns:repeat(2,1fr)} }
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:12px;padding:12px 6px;font-size:.9rem;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow);transition:background .12s,color .12s,border-color .12s}
.tabs button .badge{margin-left:4px}
/* 답안지(문제 번호 그리드) */
.sheet{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
@media (max-width:520px){ .sheet{grid-template-columns:repeat(7,1fr)} }
.sheet button{border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:8px;padding:8px 0;font-size:.82rem;font-weight:700;cursor:pointer}
.sheet button.done{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.sheet button.cur{outline:2px solid var(--acc2);outline-offset:1px}
.navbar{display:flex;gap:8px;margin-top:12px}
.navbar button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:13px 6px;font-size:.92rem;font-weight:700;cursor:pointer}
.navbar button:disabled{opacity:.4;cursor:default}
.navbar button.wide{flex:1.4}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:.8rem;color:var(--sub);margin:-4px 0 8px}
.tabs button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:var(--r);padding:15px;font-size:1.05rem;
  font-weight:700;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
/* 모의고사 버튼도 '실행'이므로 주 버튼과 같은 청록. 시험 화면의 성격은 남색 구조 요소
   (활성 탭·소제목·세그먼트·현재 위치)가 담당한다 — 탭마다 버튼 색이 달라지지 않게 한다 */
.btn.exam{background:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.btn + .btn{margin-top:10px}
.rowbtns{display:flex;gap:10px}
.rowbtns .btn{margin-top:0}
.fold{color:var(--sub);font-size:.82rem;font-weight:500;cursor:pointer;background:none;border:none;padding:4px}
.hint{color:var(--sub);font-size:.8rem;margin-top:10px}
.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;
  font-size:.75rem;padding:1px 8px;margin-left:6px;vertical-align:1px}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.topbar .meta{font-size:.85rem;color:var(--sub);text-align:right}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 16px;font-size:1.02rem;font-weight:600;line-height:1.6}
.starbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:3px 11px;font-size:1.2rem;line-height:1.25;cursor:pointer;color:var(--sub);
  flex-shrink:0;transition:color .12s,border-color .12s,background .12s}
.starbtn.on{color:var(--star);border-color:var(--star);background:var(--star-soft)}
.qcard .tag{display:inline-block;font-size:.73rem;color:var(--acc);background:var(--acc-soft);
  border-radius:6px;padding:2px 8px;font-weight:600;margin-bottom:8px}
.subj-tag{display:inline-block;font-size:.75rem;color:var(--acc);background:var(--acc-soft);
  border-radius:6px;padding:2px 8px;font-weight:600}
.choices{display:flex;flex-direction:column;gap:9px;margin:14px 0 6px}
.choices button{display:flex;align-items:flex-start;gap:10px;text-align:left;
  border:1.5px solid var(--line);background:var(--card);border-radius:12px;
  padding:12px 14px;font-size:.95rem;cursor:pointer;color:var(--ink);transition:all .1s;line-height:1.5}
.choices button .no{font-weight:800;flex-shrink:0}
.choices button:not(:disabled):hover{border-color:var(--acc)}
.choices button.sel-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.sel-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.choices button.reveal{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;margin:10px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.expl{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);
  border-radius:10px;padding:13px 14px;font-size:.92rem;margin-top:10px}
/* results */
.score{font-size:2.2rem;font-weight:800;text-align:center;margin:6px 0}
.score small{font-size:1rem;color:var(--sub);font-weight:600}
.passband{text-align:center;font-size:1.1rem;font-weight:800;border-radius:10px;padding:10px;margin-top:10px}
.passband.pass{background:var(--ok-bg);color:var(--ok)}
.passband.fail{background:var(--bad-bg);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--acc2);font-weight:700;font-size:.8rem}
.tbl td.num{text-align:right}
/* wrong note list */
.witem{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.witem:last-child{border-bottom:0}
.witem .info{flex:1;min-width:0}
.witem .t1{font-size:.9rem;font-weight:650;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.witem .t2{font-size:.78rem;color:var(--sub);margin-top:2px}
.witem .acts{display:flex;gap:6px;flex-shrink:0}
.sm{border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:6px 11px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.sm.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.sm.danger{color:var(--bad)}
.empty{text-align:center;color:var(--sub);padding:34px 0;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#20302d;color:#fff;
  padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.toast.show{opacity:.94}
.footer{color:var(--sub);font-size:.72rem;text-align:center;margin-top:26px;line-height:1.7}
/* 파동권 다른 앱 리스트 */
.promo-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border:0;background:none;
  border-top:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit}
.promo-row:first-of-type{border-top:0}
.promo-icon{width:40px;height:40px;border-radius:10px;flex:0 0 auto}
.promo-emoji{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;
  justify-content:center;font-size:1.3rem;flex:0 0 auto}
.promo-text{display:flex;flex-direction:column;min-width:0;flex:1}
.promo-name{font-weight:700;font-size:.92rem}
.promo-tagline{color:var(--sub);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-arrow{color:var(--sub);font-size:1.2rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="data.js?v=2438d"></script>
<script>
"use strict";
const $ = sel => document.querySelector(sel);
const app = $("#app");
const CIRCLED = ["①","②","③","④","⑤"];
const LS_WRONG = "naq_wrong_v1";
const LS_STAR  = "naq_star_v1";    // 별표(잘 몰라서 찍은 문제) — 오답과 별개로 보관
const LS_PREF  = "naq_pref_v1";
const LS_HIST  = "naq_hist_v1";
const LS_STAT  = "naq_stat_v1";
const LS_RESUME = "naq_resume_v1";   // 중간 저장(진행 중 세션)
const LS_RECENT = "naq_recent_v1";   // 최근 출제 이력(회차 순번) — 같은 문항이 연달아 나오지 않게
/* 앱 버전 — 배포 시 version.json의 app 값과 함께 올린다 */
const APP_VERSION = "2026.08.23.4";
/* 버전이 올라가면 비우는 키 (오답노트·학습기록·누적통계는 보존) */
const VOLATILE_KEYS = [LS_PREF, LS_RESUME];

const DATA = (window.QUIZ_DATA || {subjects:[], topics:{}, questions:[]});
const SUBJECTS = DATA.subjects;                    // [{id, name, mock}] mock = 실전 문항수
const TOPICS = DATA.topics;                        // {subjectId: [topic,...]}
const QBYID = Object.fromEntries(DATA.questions.map(q=>[q.id,q]));

let pref = load(LS_PREF, {subj:null, topics:null, count:20, autoRemove:true, autoUnstar:false, topicsOpen:true, diff:null});
let sel = {
  subj: new Set(pref.subj || SUBJECTS.map(s=>s.id)),
  topics: new Set(pref.topics || Object.values(TOPICS).flat()),
  count: pref.count || 20,
  diff: new Set(Array.isArray(pref.diff) && pref.diff.length ? pref.diff : [1,2,3])
};
const DIFF_NAME = {1:"쉬움", 2:"중간", 3:"어려움"};
const qd = q => q.d || 2;

/* 실전 모의고사 모드 — mix는 과목별 [쉬움, 중간, 어려움] 비율 */
const MOCK_MODES = {
  normal: {
    label: "노멀",
    sub: "기출 난이도 그대로",
    desc: "실제 기출 7개 회차(700문항)를 분석한 난이도 분포를 과목별로 재현합니다. 실전 체감에 가장 가깝습니다.",
    mix: {"기초":[0.641,0.327,0.033], "보건":[0.505,0.419,0.076],
          "공중":[0.350,0.393,0.257], "실기":[0.448,0.462,0.090]}
  },
  hard: {
    label: "하드",
    sub: "기출보다 어렵게",
    desc: "전 과목을 쉬움 20% · 중간 50% · 어려움 30%로 고정해 기출보다 어렵게 출제합니다. 실력 점검과 약점 훈련용입니다.",
    mix: {"기초":[0.2,0.5,0.3], "보건":[0.2,0.5,0.3], "공중":[0.2,0.5,0.3], "실기":[0.2,0.5,0.3]}
  }
};
let quiz = null;
let examTimer = null;
let noteSubj = "all";
let noteDiff = "all";
let noteView = "wrong";   // "wrong" = 오답노트, "star" = 별표
const EXAM_MIN = 105;   // 2025 CBT: 105문항 105분

function stopClock(){ if(examTimer){ clearInterval(examTimer); examTimer = null; } }
function tickClock(){
  if(!quiz || !quiz.deadline){ stopClock(); return; }
  const left = quiz.deadline - Date.now();
  if(left <= 0){
    stopClock(); quiz.timeUp = true;
    toast("⏰ 시험 시간이 종료되었습니다");
    if(quiz.defer) submitExam(); else renderResult();
    return;
  }
  const el = $("#clock");
  if(el){
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    el.textContent = `⏱ ${m}:${String(s).padStart(2,"0")}`;
    el.style.color = left < 5*60000 ? "var(--bad)" : "var(--ink)";
  }
}
function startClock(){ stopClock(); examTimer = setInterval(tickClock, 1000); tickClock(); }

function load(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function savePref(){ save(LS_PREF,{subj:[...sel.subj], topics:[...sel.topics], count:sel.count, autoRemove:pref.autoRemove, autoUnstar:pref.autoUnstar, topicsOpen:pref.topicsOpen, diff:[...sel.diff], homeTab:pref.homeTab, defer:pref.defer}); }
function wrongMap(){ return load(LS_WRONG,{}); }
function setWrong(m){ save(LS_WRONG,m); }
/* 별표 — 정답/오답과 무관하게 "잘 몰라서 찍은" 문항을 따로 모은다 */
function starMap(){ return load(LS_STAR,{}); }
function isStarred(id){ return !!starMap()[id]; }
function toggleStar(id){
  const m = starMap();
  if(m[id]) delete m[id]; else m[id] = {t:Date.now()};
  save(LS_STAR, m);
  return !!m[id];
}
function unstar(id){ const m = starMap(); delete m[id]; save(LS_STAR, m); }
function addWrong(q,picked){ const m=wrongMap(); const e=m[q.id]||{c:0}; e.c++; e.t=Date.now(); e.p=picked; m[q.id]=e; setWrong(m); }
function removeWrong(id){ const m=wrongMap(); delete m[id]; setWrong(m); }
function recordStat(q,ok){ const s=load(LS_STAT,{}); const e=s[q.id]||{r:0,w:0}; ok?e.r++:e.w++; s[q.id]=e; save(LS_STAT,s); }
function saveSession(entry){ const h=load(LS_HIST,[]); h.unshift(entry); if(h.length>100)h.length=100; save(LS_HIST,h); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function subjName(id){ const s=SUBJECTS.find(s=>s.id===id); return s?s.name:id; }

/* ---------- 보기 순서 섞기 ----------
   같은 문항을 다시 풀어도 위치로 답을 외우지 못하게 한다.
   예외: 보기가 전부 짧은 수치이고 이미 정렬돼 있으면(실제 시험 관행) 그대로 둔다. */
function keepChoiceOrder(q){
  if(q.c.some(c => String(c).length > 28)) return false;
  const nums = q.c.map(c=>{
    const m = String(c).replace(/,/g, "").match(/(\d+(?:\.\d+)?)/);
    return m ? parseFloat(m[1]) : null;
  });
  if(nums.some(n => n === null)) return false;
  const asc  = nums.every((n,i)=> i===0 || nums[i-1] <= n);
  const desc = nums.every((n,i)=> i===0 || nums[i-1] >= n);
  return asc || desc;
}
/* perm(원본 인덱스 배열)을 적용한 사본을 만든다. perm이 없으면 원본 그대로. */
function applyPerm(q, perm){
  if(!perm) return q;
  return {...q, c: perm.map(i=>q.c[i]), ans: perm.indexOf(q.ans-1)+1, _p: perm};
}
function shuffleChoices(list){
  return list.map(q => keepChoiceOrder(q) ? q : applyPerm(q, shuffle([0,1,2,3,4])));
}

function pool(){
  return DATA.questions.filter(q => sel.subj.has(q.s) && sel.topics.has(q.t) && sel.diff.has(qd(q)));
}

/* ---------- 최근 출제 회피 (LRU) ----------
   문항마다 '몇 번째 세션에 나왔는지'를 기록해 두고, 뽑을 때 순번이 낮은(=오래됐거나 아직 안 나온)
   문항을 먼저 쓴다. 과목→난이도→세부주제 층화 배분은 그대로 두고 각 칸 안에서 '누구를 뽑을지'만 바꾸므로
   출제 비중은 달라지지 않는다. 풀이 모자라면 자연히 오래된 문항이 재사용된다(막히지 않는다). */
let _recent = null;
function recentLog(){
  if(_recent) return _recent;
  const r = load(LS_RECENT, null);
  _recent = (r && r.m) ? r : {seq:0, m:{}};
  return _recent;
}
function saveRecent(r){ _recent = r; save(LS_RECENT, r); }
/* 새 세션 번호를 발급한다. 문항은 '실제로 답했을 때' 이 번호로 기록된다 — 출제만 되고
   답하지 않은 문항은 본 것으로 치지 않아 다음 회차에 다시 나올 수 있다. */
function newSessionSeq(){
  const r = recentLog();
  r.seq++;
  Object.keys(r.m).forEach(id=>{ if(!QBYID[id]) delete r.m[id]; });   // 교체·삭제된 문항 정리
  saveRecent(r);
  return r.seq;
}
function markServedOne(id, seq){
  const r = recentLog();
  if(r.m[id] === seq) return;
  r.m[id] = seq; saveRecent(r);
}
function unmarkServed(id){
  const r = recentLog();
  if(!(id in r.m)) return;
  delete r.m[id]; saveRecent(r);
}
/* 목록 전체를 한 회차로 기록 (검증 스크립트에서 '전 문항 응답' 상황을 재현할 때 사용) */
function markServed(list){
  const seq = newSessionSeq();
  const r = recentLog();
  list.forEach(q=>{ r.m[q.id] = seq; });
  saveRecent(r);
}
function servedCount(){ const m = recentLog().m; return Object.keys(m).filter(id=>QBYID[id]).length; }
/* 1회성 정리 — '풀어본 범위'의 기준을 누적 통계(=실제로 답한 문항)에 맞춘다.
   ① 예전에는 출제만 되어도 이력에 넣었으므로, 답한 적 없는 문항은 뺀다.
   ② 이 기능이 생기기 전에 이미 답한 문항은 '오래전에 푼 것'(회차 1)으로 채워 넣는다. */
function migrateRecent(){
  const r = recentLog();
  if(r.mig === 2) return;
  const stat = load(LS_STAT, {});
  Object.keys(r.m).forEach(id=>{ if(!stat[id]) delete r.m[id]; });
  Object.keys(stat).forEach(id=>{ if(QBYID[id] && !r.m[id]) r.m[id] = 1; });
  r.seq = Math.max(r.seq || 0, 1);
  r.mig = 2; saveRecent(r);
}
function freshHint(){
  const total = DATA.questions.length, seen = servedCount();
  return `<b>최근 출제 회피</b> — 한 번 푼 문항은 뒤로 미루고 오래전에 푼 문항·아직 안 풀어본 문항을 먼저 뽑습니다. `
    + `출제됐지만 답하지 않고 넘긴 문항은 안 본 것으로 처리해 다시 나옵니다. `
    + (seen ? `지금까지 ${seen}문항을 풀었고 <b>${total-seen}문항</b>이 아직 남아 있습니다.`
            : `아직 푼 문항이 없어 ${total}문항 전체가 대상입니다.`);
}
/* 오래된 것 우선, 같은 순번끼리는 무작위 (먼저 섞고 안정 정렬하면 동순위 안에서 순서가 무작위로 남는다) */
function pickLRU(arr, n){
  if(n <= 0 || !arr.length) return [];
  if(n >= arr.length) return shuffle(arr.slice());
  const m = recentLog().m;
  return shuffle(arr.slice()).sort((a,b)=> (m[a.id]||0) - (m[b.id]||0)).slice(0, n);
}

/* 최대 잔여법으로 정수 배분: items=[{key, share}] → {key: n}, 합계 = total */
function allocate(items, total){
  const out = items.map(x=>({...x, n: Math.floor(x.share)}));
  let used = out.reduce((a,x)=>a+x.n, 0);
  out.slice().sort((a,b)=>(b.share-b.n)-(a.share-a.n)).forEach(x=>{ if(used<total){ x.n++; used++; } });
  return out;
}

/* 문제 풀기 배분 계획: 실전 과목 비율 → 난이도 20/50/30 → (선택 안 한 항목은 재정규화) */
const PRACTICE_DIFF_MIX = {1:0.2, 2:0.5, 3:0.3};
function practicePlan(n){
  const p = pool();
  if(!p.length) return null;
  const capped = Math.min(n, p.length);
  const subjs = SUBJECTS.filter(s=>p.some(q=>q.s===s.id));
  const wSum = subjs.reduce((a,s)=>a+s.mock, 0) || 1;
  const sq = allocate(subjs.map(s=>({key:s.id, share: capped*s.mock/wSum})), capped);
  const plan = {total:capped, subj:{}, diff:{1:0,2:0,3:0}, cells:[]};
  for(const s of sq){
    plan.subj[s.key] = s.n;
    const sPool = p.filter(q=>q.s===s.key);
    const dAvail = [1,2,3].filter(d=>sPool.some(q=>qd(q)===d));
    const dwSum = dAvail.reduce((a,d)=>a+PRACTICE_DIFF_MIX[d], 0) || 1;
    const dq = allocate(dAvail.map(d=>({key:d, share: s.n*PRACTICE_DIFF_MIX[d]/dwSum})), s.n);
    dq.forEach(x=>{ plan.diff[x.key] += x.n; plan.cells.push({s:s.key, d:x.key, n:x.n}); });
  }
  return plan;
}

/* 계획대로 실제 문항 추출 (부족한 칸은 같은 과목 → 전체 순으로 보충) */
function buildPracticeList(n){
  const p = pool();
  const plan = practicePlan(n);
  if(!plan) return [];
  if(plan.total >= p.length) return shuffle(p.slice());
  const usedIds = new Set();
  let picked = [];
  for(const c of plan.cells){
    const cell = p.filter(q=>q.s===c.s && qd(q)===c.d && !usedIds.has(q.id));
    const take = sampleByTopic(cell, Math.min(c.n, cell.length), c.s);
    take.forEach(q=>usedIds.add(q.id));
    picked = picked.concat(take);
  }
  // 과목별 부족분 보충
  for(const [sid, want] of Object.entries(plan.subj)){
    const have = picked.filter(q=>q.s===sid).length;
    if(have >= want) continue;
    const rest = p.filter(q=>q.s===sid && !usedIds.has(q.id));
    const add = sampleByTopic(rest, Math.min(want-have, rest.length), sid);
    add.forEach(q=>usedIds.add(q.id));
    picked = picked.concat(add);
  }
  // 전체 부족분 보충
  if(picked.length < plan.total){
    pickLRU(p.filter(q=>!usedIds.has(q.id)), plan.total - picked.length)
      .forEach(q=>{ usedIds.add(q.id); picked.push(q); });
  }
  return shuffle(picked);
}

/* 주어진 풀에서 n개를 주제 비례(정수 몫+최대 잔여)로 추출 */
function sampleByTopic(poolQs, n, subjId){
  if(n <= 0 || !poolQs.length) return [];
  if(n >= poolQs.length) return poolQs.slice();
  const byTopic = {};
  poolQs.forEach(q=>{ (byTopic[q.t] = byTopic[q.t]||[]).push(q); });
  const quotas = (TOPICS[subjId]||Object.keys(byTopic)).filter(t=>byTopic[t]).map(t=>{
    const share = byTopic[t].length * n / poolQs.length;
    return {t, share, n: Math.floor(share)};
  });
  let used = quotas.reduce((a,x)=>a+x.n, 0);
  quotas.sort((a,b)=>(b.share-b.n)-(a.share-a.n));
  for(let i=0; used<n && i<quotas.length; i++, used++) quotas[i].n++;
  let picked = [];
  quotas.forEach(x=>{ picked = picked.concat(pickLRU(byTopic[x.t], x.n)); });
  if(picked.length < n){
    const ids = new Set(picked.map(q=>q.id));
    picked = picked.concat(pickLRU(poolQs.filter(q=>!ids.has(q.id)), n-picked.length));
  }
  return picked;
}

/* 실전 모의고사 출제: 과목 → 난이도(모드별 배합) → 세부주제 비례 3단 층화 (홈 필터 무시) */
function startMock(modeKey){
  const mode = MOCK_MODES[modeKey];
  let list = [];
  for(const s of SUBJECTS){
    const subjQs = DATA.questions.filter(q=>q.s===s.id);
    const ratio = mode.mix[s.id] || [0.2,0.5,0.3];
    const dq = [1,2,3].map(d=>{
      const share = s.mock * ratio[d-1];
      return {d, share, n: Math.floor(share)};
    });
    let used = dq.reduce((a,x)=>a+x.n, 0);
    dq.sort((a,b)=>(b.share-b.n)-(a.share-a.n));
    for(let i=0; used<s.mock; i++, used++) dq[i%dq.length].n++;
    let picked = [];
    const pickedIds = new Set();
    for(const {d, n} of dq){
      const poolD = subjQs.filter(q=>qd(q)===d && !pickedIds.has(q.id));
      const got = sampleByTopic(poolD, Math.min(n, poolD.length), s.id);
      got.forEach(q=>pickedIds.add(q.id));
      picked = picked.concat(got);
    }
    if(picked.length < s.mock){   // 특정 난이도 풀 부족 시 잔여로 보충
      const rest = subjQs.filter(q=>!pickedIds.has(q.id));
      picked = picked.concat(sampleByTopic(rest, s.mock - picked.length, s.id));
    }
    // 실제 시험처럼 과목 순서(기초→보건→공중→실기)를 유지하고, 과목 안에서만 섞는다
    list = list.concat(shuffle(picked));
  }
  startQuiz(list, {mock:true, mode:modeKey, defer:!!pref.defer});
}

/* ---------- quiz ---------- */
function startQuiz(list, opts){
  if(!list.length){ toast("출제할 문항이 없습니다"); return; }
  quiz = {list: shuffleChoices(list), idx:0, answers:[], fromNote:!!opts.fromNote, fromStar:!!opts.fromStar,
          mock:!!opts.mock, mode:opts.mode||null, defer:!!opts.defer};
  quiz.seq = newSessionSeq();   // 출제 이력에 쓸 회차 번호. 기록은 answer()에서 답한 문항만 한다
  if(quiz.mock) quiz.deadline = Date.now() + EXAM_MIN*60*1000;
  renderQ();
}

function answeredCount(){ return quiz.answers.filter(a=>a && a.pick).length; }

/* 자동 넘김 대기 타이머 — 사용자가 먼저 이동하면 취소해야 화면이 튀지 않는다 */
let advTimer = null;
function clearAdvance(){ if(advTimer){ clearTimeout(advTimer); advTimer = null; } }

/* ---------- 중간 저장 / 이어서 풀기 (모드별로 따로 보관) ---------- */
function loadResumes(){
  const raw = load(LS_RESUME, null);
  if(!raw) return [];
  return Array.isArray(raw) ? raw : [raw];   // 구 형식(단일 객체) 호환
}
function saveResumes(arr){
  if(arr.length) save(LS_RESUME, arr.slice(0,6)); else localStorage.removeItem(LS_RESUME);
}
function resumeKey(st){
  return st.mock ? `mock:${st.mode||"-"}:${st.defer?"defer":"now"}`
                 : (st.fromNote ? "note" : (st.fromStar ? "star" : "practice"));
}
function resumeTab(st){ return st.mock ? "mock" : ((st.fromNote||st.fromStar) ? "note" : "practice"); }
function resumeKind(st){
  return st.mock
    ? `실전 모의고사${st.mode&&MOCK_MODES[st.mode]?" · "+MOCK_MODES[st.mode].label:""} · ${st.defer?"종료 후 채점":"바로 채점"}`
    : (st.fromNote ? "오답노트 복습" : (st.fromStar ? "별표 복습" : "문제 풀이"));
}
function pauseQuiz(){
  if(!quiz) return;
  clearAdvance();
  const st = {
    t: Date.now(),
    ids: quiz.list.map(q=>q.id),
    perms: quiz.list.map(q=> q._p || null),   // 보기 순서까지 그대로 복원해야 저장된 답이 어긋나지 않는다
    answers: quiz.answers.map(a=> a ? {pick:a.pick, ok:a.ok} : null),
    idx: quiz.idx, mock: quiz.mock, mode: quiz.mode, defer: quiz.defer, fromNote: quiz.fromNote, fromStar: quiz.fromStar,
    seq: quiz.seq,   // 이어서 풀 때도 같은 회차로 기록되도록 보존
    remain: quiz.deadline ? Math.max(0, quiz.deadline - Date.now()) : null
  };
  const arr = loadResumes().filter(x=>resumeKey(x) !== resumeKey(st));   // 같은 모드는 최신 것으로 교체
  arr.unshift(st);
  saveResumes(arr);
  stopClock(); document.onkeydown = null;
  const back = resumeTab(st);
  quiz = null;
  toast("진행 상황을 저장했습니다");
  goTab(back);
}
function resumeQuiz(key){
  const arr = loadResumes();
  const st = arr.find(x=>resumeKey(x) === key);
  if(!st) return;
  // 저장된 보기 순서(perms)를 그대로 되살린다. 구 형식(perms 없음)은 원본 순서로 복원.
  const list = st.ids.map((id,i)=> {
    const q = QBYID[id];
    return q ? applyPerm(q, st.perms && st.perms[i]) : q;
  });
  if(list.some(q=>!q)){
    saveResumes(arr.filter(x=>x !== st));
    toast("문항이 바뀌어 이어서 풀 수 없습니다");
    goTab(homeTab); return;
  }
  quiz = {list, idx: Math.min(st.idx, list.length-1), answers: st.answers.map(a=>a||null),
          mock: !!st.mock, mode: st.mode||null, defer: !!st.defer, fromNote: !!st.fromNote, fromStar: !!st.fromStar,
          seq: st.seq || newSessionSeq()};   // 구 형식(seq 없음)은 새 회차를 발급
  // 바로 채점 모드에서 이미 채점된 문항에 머물러 있으면 다음 문항부터
  if(!quiz.defer && quiz.answers[quiz.idx]) quiz.idx = Math.min(quiz.idx+1, list.length-1);
  if(st.remain != null) quiz.deadline = Date.now() + st.remain;
  saveResumes(arr.filter(x=>x !== st));
  renderQ();
}
function resumeCardHtml(forTab){

  if(!mine.length) return "";
  return `<div class="card" style="border-left:4px solid var(--acc2)">

function bindResume(){
  app.querySelectorAll("[data-resume]").forEach(b=> b.onclick = ()=> resumeQuiz(b.dataset.resume));
  app.querySelectorAll("[data-drop]").forEach(b=> b.onclick = ()=>{

/* 종료 후 채점 모드의 문항 이동 바 (문제 위·아래 동일하게 배치) */
function navbarHtml(total){

    <button data-nav="prev" ${quiz.idx===0?"disabled":""}>← 이전</button>
    <button data-nav="sheet" class="wide">답안지 (${answeredCount()}/${total})</button>
    <button data-nav="next" ${quiz.idx===total-1?"disabled":""}>다음 →</button>
  </div>`;
}

function renderQ(){
  const q = quiz.list[quiz.idx];
  const total = quiz.list.length;
  const cur = quiz.answers[quiz.idx];
  const def = quiz.defer;
  app.innerHTML = `
  <div class="topbar">
    <span style="display:flex;gap:6px">
      <button class="sm" id="pauseBtn">정지</button>
      <button class="sm" id="quitBtn">${def?"제출":"종료"}</button>
    </span>
    <span class="meta">${quiz.mock?`<span id="clock" style="font-weight:800"></span> · `:""}${quiz.mock&&quiz.mode?esc(MOCK_MODES[quiz.mode].label)+" · ":""}${quiz.fromNote?"오답노트 · ":""}${quiz.fromStar?"별표 복습 · ":""}${quiz.idx+1} / ${total}<br>
      <span class="subj-tag">${esc(subjName(q.s))}</span></span>
  </div>
  <div class="prog"><i style="width:${(def?answeredCount():quiz.idx)/total*100}%"></i></div>
  ${def?`<div class="qmeta"><span>${esc(subjName(q.s))} · ${esc(q.t)}</span><span>답안 ${answeredCount()} / ${total}</span></div>`:""}
  ${def?navbarHtml(total):""}
  <div class="qcard" ${def?'style="margin-top:12px"':""}>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px">
      ${def?`<span class="tag">${quiz.idx+1}번</span>`:`<span class="tag">${esc(q.t)}</span>`}
      <button class="starbtn ${isStarred(q.id)?"on":""}" id="starBtn"
        title="잘 몰라서 찍은 문제 — 복습 탭의 별표 목록에 모입니다">${isStarred(q.id)?"★":"☆"}</button>
    </div>${esc(q.q)}</div>
  <div class="choices" id="choiceBtns">
    ${q.c.map((c,i)=>`<button data-a="${i+1}"${def&&cur&&cur.pick===i+1?' class="sel-ok"':""}><span class="no">${CIRCLED[i]}</span><span>${esc(c)}</span></button>`).join("")}
  </div>
  ${def?`
  ${navbarHtml(total)}
  ${cur?`<p class="hint" style="text-align:center">보기를 다시 누르면 답을 바꿀 수 있습니다</p>`
       :`<p class="hint" style="text-align:center">답을 고르지 않고 다음 문제로 건너뛸 수 있습니다</p>`}
  `:""}
  <div id="feedback"></div>`;

  $("#starBtn").onclick = ()=>{
    const on = toggleStar(q.id);
    const b = $("#starBtn");
    b.textContent = on ? "★" : "☆";
    b.classList.toggle("on", on);
    toast(on ? "별표에 추가했습니다" : "별표를 해제했습니다");
  };
  $("#pauseBtn").onclick = pauseQuiz;
  $("#quitBtn").onclick = ()=>{
    if(def) return submitExam();
    return quiz.answers.filter(Boolean).length ? renderResult() : renderHome();
  };
  $("#choiceBtns").addEventListener("click", ev=>{
    const b = ev.target.closest("[data-a]"); if(!b) return;
    answer(+b.dataset.a);
  });
  if(def){
    app.querySelectorAll("[data-nav]").forEach(b=> b.onclick = ()=>{
      const k = b.dataset.nav;
      clearAdvance();
      if(k==="sheet") return renderSheet();
      if(k==="prev" && quiz.idx>0){ quiz.idx--; renderQ(); }
      if(k==="next" && quiz.idx<total-1){ quiz.idx++; renderQ(); }
    });
  }
  document.onkeydown = ev=>{
    if(!quiz) return;
    if(["1","2","3","4","5"].includes(ev.key)){
      if(def || !quiz.answers[quiz.idx]) answer(+ev.key);
    }
    if(def){
      if(ev.key==="ArrowLeft" && quiz.idx>0){ quiz.idx--; renderQ(); }
      if(ev.key==="ArrowRight" && quiz.idx<total-1){ quiz.idx++; renderQ(); }
    }else if(ev.key==="Enter" && quiz.answers[quiz.idx]) nextQ();
  };
  if(quiz.deadline) startClock();
  window.scrollTo(0,0);
}

/* ---------- 광고 (앱 래퍼에서만 동작 — 웹 브라우저에서는 브릿지가 없어 no-op) ----------
   즉시 채점 모드: 25문항 답할 때마다 다음 문제로 넘어가는 시점에 전면 광고.
   종료 후 채점(모의고사 포함): 타이머를 방해하지 않도록 제출·채점 시 1회만. */
const AD_EVERY = 25;
let adCount = 0, adPending = false;
function adShow(){
  try{
    if(window.MiniBridge && MiniBridge.showInterstitial){ MiniBridge.showInterstitial(); return; }
    const g = window.__tossAdGroups;
    if(window.TossAdsBridge && g && g.interstitial){
      const p = TossAdsBridge.showInterstitial(g.interstitial);
      if(p && p.then) p.then(()=>TossAdsBridge.preloadInterstitial(g.interstitial)).catch(()=>{});
    }
  }catch(e){}
}
function adTick(){ adCount++; if(adCount % AD_EVERY === 0) adPending = true; }
function adMaybeShow(){ if(adPending){ adPending = false; adShow(); } }
try{
  const g = window.__tossAdGroups;
  if(window.TossAdsBridge && g && g.interstitial) TossAdsBridge.preloadInterstitial(g.interstitial);
}catch(e){}

/* ---------- 파동권 앱 연동: 앱·성적 공유 + 다른 앱 리스트 ----------
   레지스트리(https://fadongkwon.com/apps.csv)는 전 앱 공통 원본.
   링크 규칙: Play=스토어 URL, 토스=createShareLink(https) — intoss 원문은
   메신저에서 하이퍼링크가 안 되는 죽은 텍스트라 폴백으로만 쓴다. */
const SELF_APP_ID = "nursing-quiz";
const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.fadongkwon.nursing_quiz";
const TOSS_SCHEME = "intoss://nursing-quiz";
function appPlatform(){
  if(window.MiniBridge) return "android";
  if(window.TossAdsBridge) return "toss";
  return "web";
}
async function shareTextOut(text){
  try{
    const p = appPlatform();
    if(p === "android"){
      if(!MiniBridge.shareText) return false;
      MiniBridge.shareText(text + "\n" + PLAY_STORE_URL);
      return true;
    }
    if(p === "toss"){
      let link = null;
      try{ if(TossAdsBridge.createShareLink) link = await TossAdsBridge.createShareLink(TOSS_SCHEME); }catch(e){}
      if(!TossAdsBridge.shareMessage) return false;
      return (await TossAdsBridge.shareMessage(text + "\n" + (link || TOSS_SCHEME))) === true;
    }
    const msg = text + "\n" + PLAY_STORE_URL;
    if(navigator.share){ await navigator.share({text: msg}); return true; }
    await navigator.clipboard.writeText(msg);
    toast("클립보드에 복사되었습니다");
    return true;
  }catch(e){ return false; }
}
function bindShareBtn(id, text){
  const b = document.getElementById(id); if(!b) return;
  b.onclick = ()=> shareTextOut(text).then(ok=>{
    if(!ok) return;
    const orig = b.textContent;
    b.textContent = "✅ 공유했어요!";
    setTimeout(()=>{ b.textContent = orig; }, 2000);
  });
}
const PROMO_URL = "https://fadongkwon.com/apps.csv";
const PROMO_CACHE = "naq_promo_csv";
function parsePromoCsv(text){
  const lines = text.trim().split(/\r?\n/);
  if(lines.length < 2) return [];
  const header = lines[0].split(",").map(s=>s.trim());
  const col = (row,key)=> (row[header.indexOf(key)]||"").trim();
  return lines.slice(1).map(l=>l.split(",")).filter(r=>r.length >= header.length).map(r=>({
    id: col(r,"id"), name: col(r,"name"), tagline: col(r,"tagline"), emoji: col(r,"emoji"),
    playPackage: col(r,"play_package"), tossScheme: col(r,"toss_scheme"),
    play: col(r,"play")==="1", toss: col(r,"toss")==="1", icon: col(r,"icon"),
  })).filter(a=>a.id);
}
function openPromoApp(a){
  const p = appPlatform();
  if(p === "toss"){
    if(window.TossAdsBridge.openMiniApp) TossAdsBridge.openMiniApp(a.tossScheme);
    else location.href = a.tossScheme;
  }else if(p === "android" && MiniBridge.openStore){
    MiniBridge.openStore(a.playPackage);
  }else{
    window.open("https://play.google.com/store/apps/details?id=" + a.playPackage, "_blank");
  }
}
function mountPromo(){
  const el = document.getElementById("promoList"); if(!el) return;
  const p = appPlatform();
  const render = (csv)=>{
    const apps = parsePromoCsv(csv).filter(a=> a.id !== SELF_APP_ID && (p==="toss" ? a.toss : a.play));
    if(!apps.length){ el.innerHTML = ""; return; }
    el.innerHTML = `<div class="card"><h2>이런 앱도 있어요</h2>` + apps.map((a,i)=>
      `<button class="promo-row" data-promo="${i}">` +
      (a.icon ? `<img class="promo-icon" src="${a.icon}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display=''"><span class="promo-emoji" style="display:none">${a.emoji}</span>`
              : `<span class="promo-emoji">${a.emoji}</span>`) +
      `<span class="promo-text"><span class="promo-name">${esc(a.name)}</span><span class="promo-tagline">${esc(a.tagline)}</span></span><span class="promo-arrow">›</span></button>`
    ).join("") + `</div>`;
    el.querySelectorAll("[data-promo]").forEach(b=> b.onclick = ()=> openPromoApp(apps[+b.dataset.promo]));
  };
  let cached = null;
  try{ cached = localStorage.getItem(PROMO_CACHE); }catch(e){}
  if(cached) render(cached);
  fetch(PROMO_URL, {cache:"no-cache"}).then(r=> r.ok ? r.text() : null).then(fresh=>{
    if(!fresh || !fresh.split(/\r?\n/)[0].includes("id") || fresh === cached) return;
    try{ localStorage.setItem(PROMO_CACHE, fresh); }catch(e){}
    render(fresh);
  }).catch(()=>{});
}

function answer(pick){
  const q = quiz.list[quiz.idx];
  if(quiz.defer){
    // 종료 후 채점: 정오 표시 없이 선택만 기록하고 언제든 변경 가능
    const prev = quiz.answers[quiz.idx];
    const fresh = !(prev && prev.pick);                    // 처음 답하는 문항인가
    quiz.answers[quiz.idx] = (prev && prev.pick === pick) ? null : {pick};
    // 답을 지우면 출제 이력에서도 빼서, 안 푼 문항은 다시 나올 수 있게 한다
    if(quiz.answers[quiz.idx]) markServedOne(q.id, quiz.seq); else unmarkServed(q.id);
    renderQ();
    // 처음 답한 경우에만 자동으로 다음 문항으로 (답 변경·해제 시에는 머무름)
    clearAdvance();
    if(fresh && quiz.answers[quiz.idx] && quiz.idx < quiz.list.length-1){
      const at = quiz.idx;
      advTimer = setTimeout(()=>{
        advTimer = null;
        if(quiz && quiz.defer && quiz.idx===at){ quiz.idx++; renderQ(); }
      }, 220);
    }
    return;
  }
  if(quiz.answers[quiz.idx]) return;
  const ok = pick === q.ans;
  quiz.answers[quiz.idx] = {pick, ok};
  markServedOne(q.id, quiz.seq);
  $("#choiceBtns").querySelectorAll("button").forEach(b=>{
    const a = +b.dataset.a;
    b.disabled = true;
    if(a===pick) b.classList.add(ok?"sel-ok":"sel-bad");
    else if(a===q.ans) b.classList.add("reveal");
  });
  recordStat(q, ok);
  adTick();
  if(!ok) addWrong(q, pick);
  else {
    if(quiz.fromNote && pref.autoRemove){ removeWrong(q.id); toast("오답노트에서 제거되었습니다"); }
    if(quiz.fromStar && pref.autoUnstar){ unstar(q.id); toast("별표가 해제되었습니다"); }
  }

  const last = quiz.idx === quiz.list.length-1;
  $("#feedback").innerHTML = `
    <div class="verdict ${ok?"ok":"bad"}">${ok?"⭕ 정답입니다!":"❌ 오답입니다. 정답은 "+CIRCLED[q.ans-1]}</div>
    <div class="expl"><span class="subj-tag" style="margin-bottom:6px;display:inline-block">난이도 ${DIFF_NAME[qd(q)]}</span><br>${esc(q.exp)}</div>
    <button class="btn" id="nextBtn" style="margin-top:14px">${last?"결과 보기":"다음 문제"}</button>`;
  $("#nextBtn").onclick = nextQ;
  $("#nextBtn").focus();
}

function nextQ(){
  adMaybeShow();
  if(quiz.idx < quiz.list.length-1){ quiz.idx++; renderQ(); }
  else renderResult();
}

/* ---------- 답안지 (종료 후 채점 모드) ---------- */

  const bySubj = {};
  quiz.list.forEach((q,i)=>{ (bySubj[q.s] = bySubj[q.s]||[]).push(i); });
  app.innerHTML = `

    <span style="display:flex;gap:6px">
      <button class="sm" id="backBtn">← 문제로</button>
      <button class="sm" id="pauseBtn">정지</button>
    </span>
    <span class="meta"><span id="clock" style="font-weight:800"></span> · 답안 ${answeredCount()} / ${total}</span>
  </div>
  ${SUBJECTS.filter(s=>bySubj[s.id]).map(s=>{
    const idxs = bySubj[s.id];
    const done = idxs.filter(i=>quiz.answers[i]&&quiz.answers[i].pick).length;
    return `<div class="card">
      <h2>${esc(s.name)} <span style="color:var(--sub);font-weight:500;font-size:.8rem">${done} / ${idxs.length} 응답</span></h2>
      <div class="sheet">
        ${idxs.map(i=>{
          const a = quiz.answers[i];
          return `<button data-jump="${i}" class="${a&&a.pick?"done":""} ${i===quiz.idx?"cur":""}">${i+1}${a&&a.pick?`<br><span style="font-weight:500;font-size:.9em">${CIRCLED[a.pick-1]}</span>`:""}</button>`;
        }).join("")}
      </div>
    </div>`;
  }).join("")}
  <button class="btn exam" id="submitBtn">답안 제출하고 채점하기 (${answeredCount()} / ${total} 응답)</button>
  <p class="hint" style="text-align:center">미응답 문항은 오답으로 처리됩니다.</p>`;
  $("#backBtn").onclick = renderQ;
  $("#pauseBtn").onclick = pauseQuiz;
  $("#submitBtn").onclick = submitExam;
  app.querySelectorAll("[data-jump]").forEach(b=> b.onclick = ()=>{
    clearAdvance(); quiz.idx = +b.dataset.jump; renderQ();
  });
  document.onkeydown = null;
  if(quiz.deadline) startClock();
  window.scrollTo(0,0);
}

/* 종료 후 채점: 제출 시 일괄 채점 */
function submitExam(){
  clearAdvance();
  const left = quiz.list.length - answeredCount();
  if(!quiz.timeUp && left > 0 &&
     !confirm(`아직 답하지 않은 문항이 ${left}개 있습니다.\n미응답은 오답으로 처리됩니다. 제출할까요?`)) return;
  quiz.list.forEach((q,i)=>{
    const a = quiz.answers[i];
    if(!a || !a.pick) return;
    a.ok = a.pick === q.ans;
    recordStat(q, a.ok);
    if(!a.ok) addWrong(q, a.pick);
  });
  adShow(); // 종료 후 채점: 제출 시 1회 (풀이 중에는 광고 없음)
  renderResult();
}

/* ---------- result ---------- */
function renderResult(){
  document.onkeydown = null;
  stopClock(); clearAdvance();
  if(quiz){   // 완료한 모드의 중간 저장만 해제 (다른 모드 저장분은 유지)
    const k = resumeKey({mock:quiz.mock, mode:quiz.mode, defer:quiz.defer, fromNote:quiz.fromNote, fromStar:quiz.fromStar});
    saveResumes(loadResumes().filter(x=>resumeKey(x) !== k));
  }
  const done = quiz.answers.filter(Boolean);
  const n = done.length;
  const okN = done.filter(a=>a.ok).length;
  const total = quiz.list.length;
  const unanswered = total - n;
  const full = quiz.mock;   // 모의고사는 미응답을 오답으로 집계
  const subjStat = {};
  const diffStat = {};
  const wrongs = [];
  quiz.list.forEach((q,i)=>{
    const a = quiz.answers[i];
    if(!a && !full) return;
    const s = subjStat[q.s] || (subjStat[q.s]={ok:0,all:0});
    s.all++;
    if(a && a.ok) s.ok++;
    const dstat = diffStat[qd(q)] || (diffStat[qd(q)]={ok:0,all:0});
    dstat.all++;
    if(a && a.ok) dstat.ok++;
    if(a && !a.ok) wrongs.push({q, pick:a.pick});
  });
  const denom = full ? total : n;
  // 실전 판정: 총점 60% 이상 & 매 과목 40% 이상 (미응답=오답)
  let passHtml = "";
  let mockPass = null;   // 성적 공유 문구에 사용
  const failSubj = quiz.mock ? SUBJECTS.filter(s=>{
    const st = subjStat[s.id]; return st && st.ok < Math.ceil(st.all*0.4);
  }) : [];
  if(quiz.mock){
    const cut = Math.ceil(total*0.6);
    const totalPass = okN >= cut;
    const pass = totalPass && failSubj.length===0;
    mockPass = pass;
    passHtml = `<div class="passband ${pass?"pass":"fail"}">
      ${pass?"🎉 합격 기준 통과!":"불합격 기준"} (총점 ${okN}점${totalPass?" ≥":" <"} 합격선 ${cut}점${failSubj.length?` · 과락: ${failSubj.map(s=>esc(s.name)).join(", ")}`:""})
    </div>
    ${unanswered?`<div style="text-align:center;color:var(--sub);font-size:.82rem;margin-top:8px">${quiz.timeUp?"⏰ 시간 종료 — ":""}미응답 ${unanswered}문항은 오답으로 처리되었습니다</div>`:""}`;
  }
  if(!quiz.saved && n>0){
    quiz.saved = true;
    saveSession({t:Date.now(), n:denom, ok:okN, mock:quiz.mock, mode:quiz.mode, defer:quiz.defer, note:quiz.fromNote,
      subj:[...new Set(quiz.list.slice(0, full?total:quiz.answers.length).map(q=>subjName(q.s)))].slice(0,4),
      bs:Object.fromEntries(Object.entries(subjStat).map(([k,v])=>[k,[v.ok,v.all]])),
      bd:Object.fromEntries(Object.entries(diffStat).map(([k,v])=>[k,[v.ok,v.all]]))});
  }
  app.innerHTML = `
  <h1>채점 결과${quiz.mock && quiz.mode ? ` <span class="subj-tag" style="font-size:.8rem;vertical-align:3px">실전 ${esc(MOCK_MODES[quiz.mode].label)}${quiz.defer?" · 종료 후 채점":""}</span>` : ""}</h1>
  <div class="card">
    <div class="score">${okN} / ${denom} <small>문항</small></div>
    <div style="text-align:center;color:var(--sub);font-size:.95rem">정답률 ${denom?Math.round(okN/denom*100):0}%</div>
    ${passHtml}
  </div>
  <div class="card">
    <h2>과목별 성적</h2>
    <table class="tbl"><tr><th>과목</th><th style="text-align:right">정답 / 문항</th></tr>
    ${SUBJECTS.filter(s=>subjStat[s.id]).map(s=>{
      const st=subjStat[s.id];
      const gwarak = quiz.mock && st.ok < Math.ceil(st.all*0.4);
      return `<tr><td>${esc(s.name)}${gwarak?' <span style="color:var(--bad);font-weight:800;font-size:.78rem">과락</span>':""}</td><td class="num">${st.ok} / ${st.all} (${Math.round(st.ok/st.all*100)}%)</td></tr>`;
    }).join("")}
    </table>
    ${quiz.mock?`<p class="hint">합격 기준: 총점 60% 이상 + 매 과목 40% 이상 (과목 40% 미만 = 과락)</p>`:""}
  </div>
  ${wrongs.length?`
  <div class="card">
    <h2>이번에 틀린 문제 (${wrongs.length})</h2>
    ${wrongs.map(w=>`
      <div class="witem">
        <div class="info">
          <div class="t1">${esc(w.q.q)}</div>
          <div class="t2"><span class="subj-tag">${esc(w.q.t)}</span> 내 답 ${CIRCLED[w.pick-1]} → 정답 ${CIRCLED[w.q.ans-1]}</div>
        </div>
        <div class="acts"><button class="sm" data-view="${w.q.id}">보기</button></div>
      </div>`).join("")}
  </div>`:""}
  <div class="rowbtns">
    <button class="btn ghost" id="homeBtn">홈으로</button>
    <button class="btn" id="noteBtn">오답노트${wrongs.length?" 복습":""}</button>
  </div>
  <button class="btn ghost" id="shareScoreBtn" style="margin-top:10px">📤 성적 공유하기</button>`;
  app.querySelectorAll("[data-view]").forEach(b=> b.onclick = ()=> viewOne(b.dataset.view, renderResult, true));
  $("#homeBtn").onclick = ()=> goTab(quiz.mock ? "mock" : "practice");
  $("#noteBtn").onclick = ()=> goTab("note");
  const pctS = denom ? Math.round(okN/denom*100) : 0;
  bindShareBtn("shareScoreBtn",
    quiz.mock
      ? `간호조무사 실전 모의고사 ${okN}/${denom}점 (정답률 ${pctS}%) — ${mockPass?"합격 기준 통과! 🎉":"다음엔 합격 기준에 도전!"}\n간호조무사 모의고사 앱에서 함께 공부해요.`
      : `간호조무사 문제풀이 ${okN}/${denom} 정답 (정답률 ${pctS}%)\n간호조무사 모의고사 앱에서 함께 공부해요.`);
  window.scrollTo(0,0);
}

/* ---------- single view ---------- */
/* useSession=true면 방금 푼 세션의 보기 순서로 보여준다(결과 화면의 "내 답 ③"과 일치시키기 위해).
   오답노트에서는 false로 호출해 항상 원본 순서로 보여준다(방문마다 순서가 바뀌지 않도록). */
function viewOne(id, backFn, useSession){
  const q = (useSession && quiz && quiz.list.find(x=>x.id===id)) || QBYID[id];
  if(!q) return;
  app.innerHTML = `
  <div class="topbar"><button class="sm" id="backBtn">← 돌아가기</button>
    <span class="meta"><span class="subj-tag">${esc(subjName(q.s))} · ${esc(q.t)}</span></span></div>
  <div class="qcard">
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
      <button class="starbtn ${isStarred(q.id)?"on":""}" id="starBtn2" title="별표">${isStarred(q.id)?"★":"☆"}</button>
    </div>${esc(q.q)}</div>
  <div class="choices">
    ${q.c.map((c,i)=>`<button disabled class="${i+1===q.ans?"reveal":""}"><span class="no">${CIRCLED[i]}</span><span>${esc(c)}</span></button>`).join("")}
  </div>
  <div class="expl">${esc(q.exp)}</div>`;
  $("#backBtn").onclick = backFn;
  $("#starBtn2").onclick = ()=>{
    const on = toggleStar(q.id);
    const b2 = $("#starBtn2");
    b2.textContent = on ? "★" : "☆";
    b2.classList.toggle("on", on);
    toast(on ? "별표에 추가했습니다" : "별표를 해제했습니다");
  };
  window.scrollTo(0,0);
}

/* ---------- 복습: 오답노트 + 별표 ---------- */
function renderNote(){
  document.onkeydown = null; stopClock();
  const isStar = noteView === "star";
  const m = isStar ? starMap() : wrongMap();
  const items = Object.entries(m).map(([id,e])=>({q:QBYID[id],e})).filter(x=>x.q)
    .sort((a,b)=> b.e.t - a.e.t);
  const wrongN = Object.keys(wrongMap()).length;
  const starN  = Object.keys(starMap()).length;
  const KIND   = isStar ? "별표" : "오답";
  // 필터가 가리키는 대상이 사라졌으면 전체로 되돌림
  const hasSubj = s => items.some(x=>x.q.s===s);
  const hasDiff = d => items.some(x=>qd(x.q)===d);
  if(noteSubj!=="all" && !hasSubj(noteSubj)) noteSubj = "all";
  if(noteDiff!=="all" && !hasDiff(+noteDiff)) noteDiff = "all";
  // 각 필터의 개수는 '다른 필터'를 적용한 상태에서 계산 (교차 개수)
  const bySubj = noteDiff==="all" ? items : items.filter(x=>qd(x.q)===+noteDiff);
  const byDiff = noteSubj==="all" ? items : items.filter(x=>x.q.s===noteSubj);
  const subjCnt = {}; bySubj.forEach(x=>{ subjCnt[x.q.s]=(subjCnt[x.q.s]||0)+1; });
  const diffCnt = {}; byDiff.forEach(x=>{ diffCnt[qd(x.q)]=(diffCnt[qd(x.q)]||0)+1; });
  const shown = items.filter(x=>
    (noteSubj==="all" || x.q.s===noteSubj) && (noteDiff==="all" || qd(x.q)===+noteDiff));
  const filterLabel = [
    noteSubj==="all" ? null : subjName(noteSubj),
    noteDiff==="all" ? null : DIFF_NAME[+noteDiff]
  ].filter(Boolean).join(" · ");
  app.innerHTML = `
  ${headerHtml()}
  ${tabsHtml("note")}
  ${resumeCardHtml("note")}
  <div class="seg" id="viewSeg" style="width:100%;margin-bottom:10px">
    <button data-view2="wrong" class="${isStar?"":"on"}" style="flex:1">오답노트 ${wrongN}</button>
    <button data-view2="star" class="star ${isStar?"on":""}" style="flex:1">★ 별표 ${starN}</button>
  </div>
  ${items.length?`
  <div class="card" style="padding:12px 14px;margin-bottom:10px">
    <h3 style="margin:0 0 6px">과목</h3>
    <div class="chips" id="noteChips">
      <button class="chip ${noteSubj==="all"?"on":""}" data-ns="all">전체<small>${bySubj.length}</small></button>
      ${SUBJECTS.filter(s=>hasSubj(s.id)).map(s=>`<button class="chip ${noteSubj===s.id?"on":""}" data-ns="${s.id}"${subjCnt[s.id]?"":' style="opacity:.45"'}>${esc(s.name)}<small>${subjCnt[s.id]||0}</small></button>`).join("")}
    </div>
    <h3 style="margin:12px 0 6px">난이도</h3>
    <div class="chips" id="noteDiffChips">
      <button class="chip ${noteDiff==="all"?"on":""}" data-nd="all">전체<small>${byDiff.length}</small></button>
      ${[1,2,3].filter(d=>hasDiff(d)).map(d=>`<button class="chip ${noteDiff===String(d)?"on":""}" data-nd="${d}"${diffCnt[d]?"":' style="opacity:.45"'}>${DIFF_NAME[d]}<small>${diffCnt[d]||0}</small></button>`).join("")}
    </div>
  </div>
  <button class="btn" id="retryAll" ${shown.length?"":"disabled"}>${filterLabel?esc(filterLabel)+" "+KIND+" 다시 풀기":KIND+" 전체 다시 풀기"} (${shown.length})</button>
  <div style="margin:10px 0 4px">
    <label style="font-size:.82rem;color:var(--sub)">
      <input type="checkbox" id="autoRm" ${(isStar?pref.autoUnstar:pref.autoRemove)?"checked":""}> 다시 풀어 맞히면 ${isStar?"별표":"목록에서"} 자동 해제
    </label>
  </div>
  <div class="card" style="padding:6px 14px">
    ${shown.length ? shown.map(({q,e})=>`
      <div class="witem">
        <div class="info">
          <div class="t1">${esc(q.q)}</div>
          <div class="t2"><span class="subj-tag">${esc(q.t)}</span> <span class="subj-tag">${DIFF_NAME[qd(q)]}</span> ${isStar?"별표":e.c+"회 틀림"} · ${new Date(e.t).toLocaleDateString("ko-KR")}</div>
        </div>
        <div class="acts">
          <button class="sm primary" data-solve="${q.id}">풀기</button>
          <button class="sm" data-view="${q.id}">해설</button>
          <button class="sm danger" data-del="${q.id}">삭제</button>
        </div>
      </div>`).join("") : `<div class="empty" style="padding:16px 0">선택한 조건에 해당하는 ${KIND} 문항이 없습니다.</div>`}
  </div>
  <button class="btn ghost" id="clearNote" style="color:var(--bad)">${KIND} 목록 전체 초기화</button>
  `:`<div class="empty">${isStar?"별표한 문항이 없습니다.<br>문제를 풀 때 문제 위 ☆ 버튼을 누르면 여기에 모입니다.":"저장된 오답이 없습니다.<br>문제를 풀다 틀리면 자동으로 저장됩니다."}</div>`}
  ${footerHtml()}
  `;
  bindTabs(); bindResume();
  $("#viewSeg").addEventListener("click", ev=>{
    const b = ev.target.closest("[data-view2]"); if(!b) return;
    noteView = b.dataset.view2; noteSubj = "all"; noteDiff = "all"; renderNote();
  });
  if(items.length){
    $("#noteChips").addEventListener("click", ev=>{
      const b = ev.target.closest("[data-ns]"); if(!b) return;
      noteSubj = b.dataset.ns; renderNote();
    });
    $("#noteDiffChips").addEventListener("click", ev=>{
      const b = ev.target.closest("[data-nd]"); if(!b) return;
      noteDiff = b.dataset.nd; renderNote();
    });
    const opts = isStar ? {fromStar:true} : {fromNote:true};
    $("#retryAll").onclick = ()=>{ if(shown.length) startQuiz(shuffle(shown.map(x=>x.q)), opts); };
    $("#autoRm").onchange = ev=>{
      if(isStar) pref.autoUnstar = ev.target.checked; else pref.autoRemove = ev.target.checked;
      savePref();
    };
    app.querySelectorAll("[data-solve]").forEach(b=> b.onclick = ()=> startQuiz([QBYID[b.dataset.solve]], opts));
    app.querySelectorAll("[data-view]").forEach(b=> b.onclick = ()=> viewOne(b.dataset.view, renderNote, false));
    app.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{
      if(isStar) unstar(b.dataset.del); else removeWrong(b.dataset.del);
      renderNote();
    });
    $("#clearNote").onclick = ()=>{
      if(confirm(`${KIND} 목록 ${items.length}문항을 전부 삭제할까요?\n삭제하면 되돌릴 수 없습니다. (학습 기록은 유지됩니다)`)){
        localStorage.removeItem(isStar ? LS_STAR : LS_WRONG);
        toast(`${KIND} 목록이 초기화되었습니다`);
        renderNote();
      }
    };
  }
  window.scrollTo(0,0);
}

/* ---------- 세션 상세 ---------- */

         `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

  if(h.mock && h.bs){
    const cut = Math.ceil(h.n*0.6);

    const pass = h.ok >= cut && fails.length===0;

    ${passHtml}
  </div>
  ${h.bs ? `
  <div class="card">
    <h2>과목별 점수</h2>
    <table class="tbl"><tr><th>과목</th><th style="width:42%"></th><th style="text-align:right">정답 / 문항</th></tr>
    ${SUBJECTS.filter(s=>h.bs[s.id]).map(s=>{

      const gwarak = h.mock && ok < Math.ceil(all*0.4);
      return `<tr><td>${esc(s.name)}${gwarak?' <span style="color:var(--bad);font-weight:800;font-size:.78rem">과락</span>':""}</td>
        <td><div style="background:var(--line);border-radius:4px;height:10px;overflow:hidden">
          <div style="width:${p}%;height:100%;background:${p>=70?"var(--ok)":p>=40?"var(--warn)":"var(--bad)"}"></div></div></td>
        <td class="num">${ok} / ${all} (${p}%)</td></tr>`;
    }).join("")}
    </table>
  </div>
  ${h.bd ? `
  <div class="card">
    <h2>난이도별 정답률</h2>
    <table class="tbl">
    ${[1,2,3].filter(d=>h.bd[d]).map(d=>{
      const [ok,all] = h.bd[d], p = Math.round(ok/all*100);
      return `<tr><td>${DIFF_NAME[d]}</td>
        <td style="width:42%"><div style="background:var(--line);border-radius:4px;height:10px;overflow:hidden">
          <div style="width:${p}%;height:100%;background:${p>=70?"var(--ok)":p>=40?"var(--warn)":"var(--bad)"}"></div></div></td>
        <td class="num">${ok} / ${all} (${p}%)</td></tr>`;
    }).join("")}
    </table>
  </div>` : ""}
  ` : `<div class="empty">이 세션은 과목별 상세가 기록되기 전에 완료되어 세부 점수를 볼 수 없습니다.<br>
    이후 완료하는 세션부터 과목·난이도별 점수가 표시됩니다.</div>`}`;
  $("#backBtn").onclick = ()=> goTab(backTab || "history");
  window.scrollTo(0,0);
}

/* ---------- history ---------- */
function renderHistory(){
  document.onkeydown = null; stopClock();
  const hist = load(LS_HIST, []);
  const stat = load(LS_STAT, {});
  const subjAcc = {};
  Object.entries(stat).forEach(([id,s])=>{
    const q = QBYID[id]; if(!q) return;
    const e = subjAcc[q.s] || (subjAcc[q.s]={r:0,w:0});
    e.r += s.r; e.w += s.w;
  });
  const totR = Object.values(subjAcc).reduce((a,e)=>a+e.r,0);
  const totW = Object.values(subjAcc).reduce((a,e)=>a+e.w,0);
  const tot = totR + totW;
  app.innerHTML = `
  ${headerHtml()}
  ${tabsHtml("history")}
  <div class="card">
    <h2>누적 통계</h2>
    ${tot?`
    <div style="display:flex;gap:18px;margin-bottom:14px;text-align:center;background:var(--acc2-soft);border-radius:10px;padding:12px 8px">
      <div style="flex:1"><div style="font-size:1.5rem;font-weight:800;color:var(--acc2)">${tot}</div><div style="font-size:.75rem;color:var(--sub)">푼 문제</div></div>
      <div style="flex:1"><div style="font-size:1.5rem;font-weight:800;color:var(--acc2)">${Math.round(totR/tot*100)}%</div><div style="font-size:.75rem;color:var(--sub)">누적 정답률</div></div>
      <div style="flex:1"><div style="font-size:1.5rem;font-weight:800;color:var(--acc2)">${hist.length}</div><div style="font-size:.75rem;color:var(--sub)">학습 세션</div></div>
    </div>
    <table class="tbl">
    ${SUBJECTS.map(s=>{
      const e = subjAcc[s.id]; if(!e || e.r+e.w===0) return "";
      const all = e.r+e.w, pct = Math.round(e.r/all*100);
      return `<tr><td>${esc(s.name)}</td>
        <td style="width:45%"><div style="background:var(--line);border-radius:4px;height:10px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${pct>=70?"var(--ok)":pct>=40?"var(--warn)":"var(--bad)"}"></div></div></td>
        <td class="num">${pct}% <span style="color:var(--sub)">(${e.r}/${all})</span></td></tr>`;
    }).join("")}
    </table>
    `:`<div class="empty" style="padding:16px 0">아직 기록이 없습니다.</div>`}
  </div>
  <div class="card">
    <h2>최근 세션</h2>
    ${hist.length ? hist.slice(0,30).map(h=>{
      const d = new Date(h.t);
      const dt = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      const pct = h.n?Math.round(h.ok/h.n*100):0;
      const i = hist.indexOf(h);
      return `<div class="witem" data-sess="${i}" style="cursor:pointer">
        <div class="info">
          <div class="t1">${h.ok} / ${h.n} 문항 <span style="color:${pct>=70?"var(--ok)":pct>=40?"var(--warn)":"var(--bad)"}">(${pct}%)</span>${h.mock?` <span class="subj-tag">실전${h.mode&&MOCK_MODES[h.mode]?" "+esc(MOCK_MODES[h.mode].label):""}</span>`:""}${h.note?' <span class="subj-tag">오답복습</span>':""}</div>
          <div class="t2">${dt} · ${(h.subj||[]).map(esc).join(", ")}${(h.subj||[]).length>=4?" 외":""}</div>
        </div>
        <div class="acts"><span style="color:var(--sub);font-size:1.1rem">›</span></div>
      </div>`;
    }).join("") : `<div class="empty" style="padding:16px 0">완료한 세션이 없습니다.</div>`}
    ${hist.length?`<p class="hint">세션을 누르면 과목별·난이도별 점수를 볼 수 있습니다.</p>`:""}
  </div>
  ${(()=>{ const seen = servedCount(), total = DATA.questions.length;
    return `<div class="card">
      <h2>풀어본 범위 <span style="color:var(--sub);font-weight:500;font-size:.8rem">${seen} / ${total}문항</span></h2>
      <div style="background:var(--line);border-radius:4px;height:10px;overflow:hidden;margin-bottom:10px">
        <div style="width:${total?Math.round(seen/total*100):0}%;height:100%;background:var(--acc2)"></div></div>
      <p class="hint" style="margin:0">한 번 푼 문항은 다른 문항이 한 바퀴 돌 때까지 뒤로 미뤄집니다.
        아직 안 풀어본 문항이 <b>${total-seen}개</b> 남아 있습니다.
        출제됐지만 답하지 않고 넘긴 문항은 여기에 포함되지 않습니다.
        ${seen?"초기화하면 전 범위를 처음 보는 것처럼 다시 순환합니다 (오답노트·별표·학습 기록은 그대로).":""}</p>
      ${seen?`<button class="btn ghost" id="clearRecent" style="margin-top:10px">풀어본 범위 초기화</button>`:""}
    </div>`; })()}
  ${(hist.length||tot)?`<button class="btn ghost" id="clearHist" style="color:var(--bad)">기록 전체 초기화</button>`:""}
  ${footerHtml()}
  `;
  bindTabs();
  app.querySelectorAll("[data-sess]").forEach(el=> el.onclick = ()=> renderSessionDetail(+el.dataset.sess, "history"));
  const rb = $("#clearRecent");
  if(rb) rb.onclick = ()=>{
    if(confirm("풀어본 범위를 초기화할까요?\n\n다음 출제부터 전 범위가 '아직 안 풀어본 문항'으로 취급됩니다.\n오답노트·별표·학습 기록·누적 통계는 삭제되지 않습니다.")){
      localStorage.removeItem(LS_RECENT); _recent = null; toast("출제 이력을 초기화했습니다"); renderHistory();
    }
  };
  const cb = $("#clearHist");
  if(cb) cb.onclick = ()=>{
    if(confirm("학습 기록과 누적 통계를 모두 삭제할까요? (오답노트·별표·출제 이력은 유지됩니다)")){
      localStorage.removeItem(LS_HIST); localStorage.removeItem(LS_STAT); renderHistory();
    }
  };
  window.scrollTo(0,0);
}

/* ---------- 버전 확인 → 구버전이면 캐시 정리 후 최신 UI로 자동 갱신 ---------- */
function checkVersion(){
  fetch("version.json?t=" + Date.now(), {cache:"no-store"})
    .then(r=> r.ok ? r.json() : null)
    .then(j=>{
      if(!j || !j.app || j.app === APP_VERSION) return;
      // 같은 버전으로 이미 한 번 새로고침했다면 반복하지 않음 (무한 루프 방지)
      if(sessionStorage.getItem("naq_reload_for") === j.app) return;
      sessionStorage.setItem("naq_reload_for", j.app);
      VOLATILE_KEYS.forEach(k=> localStorage.removeItem(k));   // 오답노트·학습기록·누적통계는 보존
      location.replace(location.pathname + "?v=" + encodeURIComponent(j.app));
    })
    .catch(()=>{});   // 오프라인 등은 무시
}

/* ---------- boot ---------- */
if(!DATA.questions.length){
  app.innerHTML = `<div class="empty">문항 데이터(data.js)를 불러오지 못했습니다.</div>`;
}else{
  migrateRecent();
  goTab(homeTab);
  checkVersion();
}
</script>
</body>
</html>
